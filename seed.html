    #summary {
      margin-top: 20px; padding: 16px;
      background: #1a1a1a; border-radius: 8px;

    }

// PART 2 — UPLOAD FUNCTIONS
// This part never changes — don't touch it
// ============================================================

const logEl = document.getElementById("log");
const summaryEl = document.getElementById("summary");
const summaryText = document.getElementById("summary-text");
const uploadBtn = document.getElementById("upload-btn");

function log(message, type = "info") {
  const line = document.createElement("div");
  line.className = type;
  line.textContent = message;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

window.clearLog = function() {
  logEl.innerHTML = "";
  summaryEl.style.display = "none";
}

async function uploadRooms() {
  log("--- Uploading Rooms ---");
  let count = 0;
  for (const room of rooms) {
    try {
      // roomId is used as document ID — no duplicates possible
      await setDoc(doc(db, "rooms", room.roomId), room);
      log(`✓ Room: ${room.name}`, "success");
      count++;
    } catch (err) {
      log(`✗ Room ${room.roomId} failed: ${err.message}`, "error");
    }
  }
  log(`Rooms done: ${count}/${rooms.length}`);
  return count;
}

async function uploadTeachers() {
  log("--- Uploading Teachers ---");
  let count = 0;
  for (const teacher of teachers) {
    try {
      // teacherCode is used as document ID
      await setDoc(doc(db, "teachers", teacher.teacherCode), teacher);
      log(`✓ Teacher: ${teacher.name}`, "success");
      count++;
    } catch (err) {
      log(`✗ Teacher ${teacher.teacherCode} failed: ${err.message}`, "error");
    }
  }
  log(`Teachers done: ${count}/${teachers.length}`);
  return count;
}

async function uploadTimetable() {
  log("--- Uploading Timetable Entries ---");
  let count = 0;
  for (const entry of timetable) {
    try {
      // Build a unique document ID from the entry data
      // This means running seed twice won't create duplicates
      const docId = [
        entry.branch,
        entry.semester,
        entry.section,
        entry.day,
        entry.startTime.replace(":", ""),
        entry.roomId
      ].join("_");

      await setDoc(doc(db, "timetable", docId), entry);
      log(`✓ ${entry.day} ${entry.startTime} — ${entry.roomId} — ${entry.subject} (${entry.branch} ${entry.section})`, "success");
      count++;
    } catch (err) {
      log(`✗ Entry failed: ${err.message}`, "error");
    }
  }
  log(`Timetable done: ${count}/${timetable.length}`);
  return count;
}

window.seedAll = async function() {
  // Check if arrays are empty
  if (rooms.length === 0 && timetable.length === 0 && teachers.length === 0) {
    log("⚠️ No data found. Add your data arrays first.", "error");
    return;
  }

  uploadBtn.disabled = true;
  summaryEl.style.display = "none";
  log("Starting upload...", "info");

  try {
    const roomCount = await uploadRooms();
    const teacherCount = await uploadTeachers();
    const ttCount = await uploadTimetable();

    log("All done! ✅", "done");
    summaryEl.style.display = "block";
    summaryText.textContent = 
      `Uploaded: ${roomCount} rooms, ${teacherCount} teachers, ${ttCount} timetable entries.`;
  } catch (err) {
    log("Something went wrong: " + err.message, "error");
  } finally {
    uploadBtn.disabled = false;
  }
}
